<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Post · Brius Agência</title>
<meta name="theme-color" content="#141210">
<link rel="icon" href="../favicon.ico" sizes="any">
<meta property="og:title" content="Um post para você ver · Brius Agência">
<meta property="og:description" content="Prévia de conteúdo criada pela Brius Agência.">
<meta property="og:image" content="https://agenciabrius.com.br/img/capa-compartilhar.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..800;1,400..700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#141210;--graphite:#1b1916;--graphite-2:#24211d;--bone:#fbf8f3;--muted-d:#b4ab9d;--gold:#b8955a;--gold-soft:#e6d3ae;--linha:#3a352f;
--serif:"Playfair Display",Georgia,serif;--body:"Manrope","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--bone);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px;max-width:560px;margin:0 auto}
.top img{height:30px;display:block;filter:invert(1) brightness(.98)}
.top a.cta{font-size:13px;color:var(--muted-d);text-decoration:none}
main{max-width:520px;margin:0 auto;padding:0 16px 48px}
.card{background:var(--graphite);border:1px solid var(--linha);border-radius:22px;overflow:hidden;animation:entra .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes entra{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.cab{display:flex;gap:12px;align-items:center;padding:14px 16px}
.av{width:40px;height:40px;border-radius:50%;background:var(--graphite-2);border:1px solid var(--linha);display:grid;place-items:center;overflow:hidden;font-weight:700;color:var(--gold-soft);flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.cab b{display:block;font-size:15px;line-height:1.2}.cab small{color:var(--muted-d);font-size:12.5px}
.midia{position:relative;background:#0d0c0b;aspect-ratio:4/5;overflow:hidden;touch-action:pan-y}
.tr{display:flex;height:100%;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.tr>*{flex:0 0 100%;width:100%;height:100%;border:0;object-fit:contain;background:#0d0c0b}
.seta{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:rgba(251,248,243,.85);color:var(--ink);font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center}
.seta.p{left:10px}.seta.n{right:10px}
.cont{position:absolute;top:10px;right:10px;background:rgba(20,18,16,.75);font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.pts{display:flex;gap:5px;justify-content:center;padding:10px 0 0}.pts i{width:6px;height:6px;border-radius:50%;background:var(--linha);transition:background .2s}.pts i.on{background:var(--gold)}
.txt{padding:12px 16px 18px}
.txt h1{font:500 24px/1.2 var(--serif);margin:0 0 4px}
.meta{color:var(--muted-d);font-size:13px;margin:0 0 12px}
.leg{white-space:pre-wrap;font-size:14.5px;margin:0;color:#e9e3d9}
.aviso{color:var(--muted-d);font-size:12.5px;text-align:center;margin:18px 8px 0;line-height:1.5}
.aviso a{color:var(--gold-soft)}
.estado{text-align:center;padding:80px 16px;color:var(--muted-d)}
.estado h1{font:500 26px var(--serif);color:var(--bone);margin:0 0 8px}
.sp{width:28px;height:28px;border:3px solid var(--linha);border-top-color:var(--gold);border-radius:50%;margin:0 auto 14px;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><a href="../" aria-label="Brius Agência"><img src="../img/logo-brius.png" alt="Brius Agência" onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:'BRIUS'}))"></a><a class="cta" href="../">agenciabrius.com.br</a></header>
<main id="app"><div class="estado"><div class="sp"></div>Carregando o post...</div></main>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbxv6WLxKRDICMjAqAGWB8Uu5oZnL-zMWQWgFxdwFTwFRyiFFvH6YV5cxWbDOoV7hOQm/exec';
const $=id=>document.getElementById(id);
const escH=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function erro(t){$('app').innerHTML='<div class="estado"><h1>Ops!</h1><p>'+escH(t)+'</p><p><a href="../" style="color:var(--gold-soft)">Ir para o site da Brius</a></p></div>'}
(async()=>{
  const t=new URLSearchParams(location.search).get('t');
  if(!t)return erro('Link incompleto. Peça o link de novo para quem compartilhou.');
  let j;try{const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({acao:'verpost',t:t})});j=await r.json()}catch(e){return erro('Não foi possível carregar agora. Tente de novo em instantes.')}
  if(!j.ok)return erro(j.erro||'Este link não está disponível.');
  const m=j.marca||{},p=j.post,arq=p.arquivos||[];
  document.title=p.titulo+' · '+(m.nome||'Brius Agência');
  const dt=p.data?(+p.data.slice(8))+' de '+MESES[+p.data.slice(5,7)-1]:'';
  const ini=(m.nome||'?').trim().charAt(0).toUpperCase();
  $('app').innerHTML='<article class="card"><div class="cab"><span class="av">'+(m.logo?'<img src="'+escH(m.logo)+'" alt="">':escH(ini))+'</span><span><b>'+escH(m.nome)+'</b><small>'+(m.insta?'@'+escH(m.insta):'Prévia de conteúdo')+'</small></span></div>'+
    '<div class="midia"><div class="tr">'+arq.map((a,i)=>a.t==='video'?'<iframe src="https://drive.google.com/file/d/'+escH(a.id)+'/preview" allow="autoplay; fullscreen" allowfullscreen title="Vídeo '+(i+1)+'"'+(i?' loading="lazy"':'')+'></iframe>':'<img src="https://lh3.googleusercontent.com/d/'+escH(a.id)+'=w1400" alt="Imagem '+(i+1)+' de '+arq.length+'"'+(i?' loading="lazy"':'')+'>').join('')+'</div>'+
    (arq.length>1?'<button class="seta p" aria-label="Anterior">‹</button><button class="seta n" aria-label="Próxima">›</button><span class="cont" id="cont">1/'+arq.length+'</span>':'')+'</div>'+
    (arq.length>1?'<div class="pts">'+arq.map((_,i)=>'<i'+(i?'':' class="on"')+'></i>').join('')+'</div>':'')+
    '<div class="txt"><h1>'+escH(p.titulo)+'</h1><p class="meta">'+escH(p.tipo||'Post')+(dt?' · previsto para '+dt:'')+'</p>'+(p.legenda?'<p class="leg">'+escH(p.legenda)+'</p>':'')+'</div></article>'+
    '<p class="aviso">Esta é uma prévia compartilhada com você. O link mostra só este post e vale por 30 dias.<br>Conteúdo feito pela <a href="../">Brius Agência</a>.</p>';
  if(m.logo){const im=document.querySelector('.av img');im.onerror=()=>{im.parentNode.textContent=ini}}
  document.querySelectorAll('.tr img').forEach(im=>{im.onerror=()=>{if(!im.dataset.f){im.dataset.f=1;im.src=im.src.replace(/lh3\.googleusercontent\.com\/d\/([^=]+)=w1400/,'drive.google.com/thumbnail?id=$1&sz=w1400')}}});
  if(arq.length>1){let i=0;const tr=document.querySelector('.tr'),pts=[...document.querySelectorAll('.pts i')];
    const ir=k=>{i=(k+arq.length)%arq.length;tr.style.transform='translateX(-'+i*100+'%)';pts.forEach((x,n)=>x.classList.toggle('on',n===i));$('cont').textContent=(i+1)+'/'+arq.length};
    document.querySelector('.seta.p').onclick=()=>ir(i-1);document.querySelector('.seta.n').onclick=()=>ir(i+1);
    let x0=null;tr.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});tr.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)ir(i+(dx<0?1:-1));x0=null});
    document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')ir(i-1);if(e.key==='ArrowRight')ir(i+1)})}
})();
</script>
</body>
</html>
